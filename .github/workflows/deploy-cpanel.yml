# Deploys the site to cPanel hosting (pratikbutani.com) over FTPS
# every time something is pushed or merged into master.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER      FTP host from cPanel, e.g. the server hostname or IP (not the Cloudflare-proxied domain)
#   FTP_USERNAME    FTP account username, e.g. deploy@pratikbutani.com
#   FTP_PASSWORD    FTP account password
#   FTP_SERVER_DIR  Folder to upload into, ending with a slash, e.g. ./ when the FTP account is rooted at public_html
#   SMTP_PASSWORD   Password of the no-reply@pratikbutani.com mailbox, used by the enquiry form.
#                   It is written into forms/smtp-config.php at deploy time and never committed.
#
# Until the secrets are added, the workflow skips the upload instead of failing.

name: Deploy to cPanel

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP secrets
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "FTP secrets are not set yet, skipping the upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the site
        if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Write the enquiry form mail settings
        if: steps.check.outputs.ready == 'true'
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          if [ -z "$SMTP_PASSWORD" ]; then
            echo "SMTP_PASSWORD is not set, the enquiry form will not be able to send."
            exit 0
          fi
          # Base64 keeps any quote or backslash in the password from breaking the PHP file.
          PASS_B64=$(printf '%s' "$SMTP_PASSWORD" | base64 -w0)
          cat > forms/smtp-config.php <<EOF
          <?php
          // Written by the deploy workflow from the SMTP_PASSWORD secret. Not in the repository.
          return [
              'host' => '127.0.0.1',
              'port' => 465,
              'user' => 'no-reply@pratikbutani.com',
              'pass' => base64_decode('${PASS_B64}'),
              'from' => 'no-reply@pratikbutani.com',
          ];
          EOF
          echo "Wrote forms/smtp-config.php"

      - name: Upload changed files to cPanel
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.idea/**
            **/.DS_Store
            README.md
            testimonials.md
